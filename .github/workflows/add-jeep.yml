name: Add Jeep GLB

on:
  push:
    paths:
      - ".github/workflows/add-jeep.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-jeep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Jeep GLB
        run: |
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 3 "https://static.poly.pizza/b88ea7fb-e4d2-49fe-a372-448b36fc2a69.glb" -o app/src/main/assets/models/jeep.glb
          file app/src/main/assets/models/jeep.glb
          ls -lh app/src/main/assets/models/jeep.glb
      - name: Commit Jeep
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/models/jeep.glb
          git diff --cached --quiet || git commit -m "Add free Jeep GLB asset"
          git push
